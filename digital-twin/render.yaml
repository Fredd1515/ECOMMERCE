services:
  - type: web
    name: digital-twin-node-red
    runtime: docker
    plan: free
    rootDir: digital-twin
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: MQTT_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_BASE_TOPIC
        value: digital-twin/openplc
      - key: MQTT_TLS_INSECURE
        value: "false"
      - key: NODE_RED_CREDENTIAL_SECRET
        sync: false
      - key: NODE_RED_ADMIN_USER
        value: admin
      - key: NODE_RED_ADMIN_PASSWORD_HASH
        sync: false
      - key: API_KEY
        sync: false

