services:
  - type: web
    name: digital-twin-node-red
    runtime: docker
    plan: free
    rootDir: digital-twin
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # MQTT se agregará en la segunda fase, cuando conectemos OpenPLC.
      - key: MQTT_BASE_TOPIC
        value: digital-twin/openplc
      - key: MQTT_TLS_INSECURE
        value: "false"
      # Render genera estos secretos automáticamente.
      - key: NODE_RED_CREDENTIAL_SECRET
        generateValue: true
      - key: NODE_RED_ADMIN_USER
        value: admin
      - key: NODE_RED_ADMIN_PASSWORD_HASH
        sync: false
      - key: API_KEY
        generateValue: true
